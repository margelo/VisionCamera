name: Documentation

on:
  push:
    branches: [main]
  public:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the documentation to the configured GitHub Pages site
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.9'
          bundler-cache: true
      - name: Build and check documentation
        env:
          HOSTING_BASE_PATH: /VisionCamera
        run: scripts/build-documentation.sh "$HOSTING_BASE_PATH"
      - name: Compile documentation examples
        run: python3 scripts/check-documentation-examples.py
      - name: Package Xcode documentation archive
        run: tar -czf build/VisionCamera.doccarchive.tar.gz -C build/documentation/Build/Products/Release-iphoneos/VisionCamera VisionCamera.doccarchive
      - name: Upload Xcode documentation archive
        uses: actions/upload-artifact@v7
        with:
          name: VisionCamera.doccarchive
          path: build/VisionCamera.doccarchive.tar.gz
          if-no-files-found: error
      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    if: >-
      github.repository == 'margelo/VisionCamera' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'public' || github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # First-time activation requires a repository administrator. After making
      # the repository public, run scripts/enable-documentation.sh once.
      - name: Check Pages configuration
        uses: actions/configure-pages@v6
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
