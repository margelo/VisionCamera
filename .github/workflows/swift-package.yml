name: Swift Package Manager

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Check package formatting
        run: xcrun swift-format lint --strict Package.swift
      - name: Validate package manifest
        run: xcrun swift package dump-package
      - name: Build iOS package
        run: >-
          xcodebuild
          -scheme VisionCamera
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/swift-package-device
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Select iOS simulator
        id: simulator
        run: |
          simulator_id=$(xcrun simctl list devices available --json | jq -r '
            [.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"][]?
             | select(.name | startswith("iPhone"))][0].udid // empty
          ')
          if [ -z "$simulator_id" ]; then
            echo "::error::No available iPhone simulator with the iOS 26.2 runtime."
            exit 1
          fi
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Test iOS package
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: >-
          xcodebuild
          -scheme VisionCamera
          -configuration Debug
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -destination-timeout 120
          -derivedDataPath build/swift-package-simulator
          -resultBundlePath build/swift-package-tests.xcresult
          CODE_SIGNING_ALLOWED=NO
          test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swift-package-tests
          path: build/swift-package-tests.xcresult
          if-no-files-found: ignore

  swiftui-example:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Build SwiftUI simulator example
        run: >-
          xcodebuild
          -project ExampleSwiftUI/VisionCameraSwiftUIExample.xcodeproj
          -scheme VisionCameraSwiftUIExample
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/swiftui-simulator
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build SwiftUI device example
        run: >-
          xcodebuild
          -project ExampleSwiftUI/VisionCameraSwiftUIExample.xcodeproj
          -scheme VisionCameraSwiftUIExample
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/swiftui-device
          CODE_SIGNING_ALLOWED=NO
          build
